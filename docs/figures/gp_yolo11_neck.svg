<svg xmlns="http://www.w3.org/2000/svg" width="1700" height="820" viewBox="0 0 1700 820">
  <defs>
    <style>
      .title { font: 700 34px Arial, sans-serif; fill: #fff; }
      .label { font: 700 24px Arial, sans-serif; fill: #14242a; }
      .small { font: 600 19px Arial, sans-serif; fill: #1f3036; }
      .tiny { font: 500 16px Arial, sans-serif; fill: #2d3e44; }
      .header { fill: #075762; stroke: #063e46; stroke-width: 2; }
      .panel { fill: #fff; stroke: #0e4b5b; stroke-width: 2.4; }
      .feat { fill: #eef8fa; stroke: #225e6b; stroke-width: 2; }
      .up { fill: #e2f5dd; stroke: #4d8c45; stroke-width: 2; }
      .cat { fill: #fff; stroke: #222; stroke-width: 2; }
      .c3 { fill: #e7f0ff; stroke: #2d65bc; stroke-width: 2; }
      .rfa { fill: #ffe6a7; stroke: #d78300; stroke-width: 2; }
      .rfa2 { fill: #dff0f6; stroke: #326a80; stroke-width: 2; }
      .out { fill: #f7fbff; stroke: #0e4b5b; stroke-width: 2; }
      .arrow { fill: none; stroke: #111; stroke-width: 3; marker-end: url(#arrow); }
      .skip { fill: none; stroke: #111; stroke-width: 3; stroke-dasharray: 8 8; marker-end: url(#arrow); }
      .level { stroke: #d6e1e5; stroke-width: 2; stroke-dasharray: 5 7; }
    </style>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 Z" fill="#111"/>
    </marker>
  </defs>

  <rect width="1700" height="820" fill="#fff"/>
  <rect x="40" y="35" width="1620" height="60" rx="8" class="header"/>
  <text x="610" y="76" class="title">GP-YOLO11 Neck with RFAConv</text>
  <rect x="40" y="120" width="1620" height="640" rx="10" class="panel"/>

  <!-- Level guides -->
  <line x1="70" y1="220" x2="1625" y2="220" class="level"/>
  <line x1="70" y1="410" x2="1625" y2="410" class="level"/>
  <line x1="70" y1="600" x2="1625" y2="600" class="level"/>
  <text x="75" y="190" class="label">P5/32</text>
  <text x="75" y="380" class="label">P4/16</text>
  <text x="75" y="570" class="label">P3/8</text>

  <!-- Backbone feature inputs -->
  <rect x="165" y="190" width="115" height="60" rx="8" class="feat"/>
  <text x="182" y="228" class="label">P5</text>
  <rect x="165" y="380" width="115" height="60" rx="8" class="feat"/>
  <text x="182" y="418" class="label">P4</text>
  <rect x="165" y="570" width="115" height="60" rx="8" class="feat"/>
  <text x="182" y="608" class="label">P3</text>

  <!-- Top-down P5 -> P4_top -->
  <path d="M280 220 H365" class="arrow"/>
  <rect x="365" y="190" width="130" height="60" rx="8" class="up"/>
  <text x="386" y="216" class="small">Upsample</text>
  <text x="407" y="241" class="tiny">x2</text>
  <path d="M430 250 V410 H520" class="arrow"/>
  <path d="M280 410 H520" class="arrow"/>
  <rect x="520" y="380" width="115" height="60" rx="8" class="cat"/>
  <text x="548" y="418" class="small">Concat</text>
  <path d="M635 410 H695" class="arrow"/>
  <rect x="695" y="380" width="105" height="60" rx="8" class="c3"/>
  <text x="724" y="418" class="small">C3k2</text>
  <path d="M800 410 H860" class="arrow"/>
  <rect x="860" y="380" width="125" height="60" rx="8" class="rfa"/>
  <text x="884" y="418" class="small">RFAConv</text>
  <path d="M985 410 H1050" class="arrow"/>
  <rect x="1050" y="380" width="125" height="60" rx="8" class="out"/>
  <text x="1072" y="418" class="small">P4_top</text>

  <!-- Top-down P4_top -> P3_out -->
  <path d="M1112 440 V520 H430 V570" class="arrow"/>
  <rect x="365" y="540" width="130" height="60" rx="8" class="up"/>
  <text x="386" y="566" class="small">Upsample</text>
  <text x="407" y="591" class="tiny">x2</text>
  <path d="M495 570 H520" class="arrow"/>
  <path d="M280 600 H520" class="arrow"/>
  <rect x="520" y="570" width="115" height="60" rx="8" class="cat"/>
  <text x="548" y="608" class="small">Concat</text>
  <path d="M635 600 H695" class="arrow"/>
  <rect x="695" y="570" width="105" height="60" rx="8" class="c3"/>
  <text x="724" y="608" class="small">C3k2</text>
  <path d="M800 600 H860" class="arrow"/>
  <rect x="860" y="570" width="125" height="60" rx="8" class="rfa"/>
  <text x="884" y="608" class="small">RFAConv</text>
  <path d="M985 600 H1050" class="arrow"/>
  <rect x="1050" y="570" width="125" height="60" rx="8" class="out"/>
  <text x="1075" y="608" class="small">P3_out</text>

  <!-- Bottom-up P3_out -> P4_out -->
  <path d="M1175 600 H1240" class="arrow"/>
  <rect x="1240" y="570" width="135" height="60" rx="8" class="rfa2"/>
  <text x="1258" y="596" class="small">RFAConv</text>
  <text x="1291" y="621" class="tiny">s=2</text>
  <path d="M1308 570 V410 H1405" class="arrow"/>
  <path d="M1175 410 H1405" class="skip"/>
  <rect x="1405" y="380" width="115" height="60" rx="8" class="cat"/>
  <text x="1433" y="418" class="small">Concat</text>
  <path d="M1520 410 H1565" class="arrow"/>
  <rect x="1565" y="380" width="105" height="60" rx="8" class="c3"/>
  <text x="1594" y="418" class="small">C3k2</text>
  <path d="M1670 410 H1678" class="arrow"/>
  <text x="1390" y="360" class="tiny">with P4_top</text>

  <!-- Keep final P4_out branch compact in a second line to avoid overflow -->
  <rect x="1405" y="470" width="125" height="60" rx="8" class="rfa"/>
  <text x="1429" y="508" class="small">RFAConv</text>
  <path d="M1618 440 V500 H1530" class="arrow"/>
  <path d="M1405 500 H1340" class="arrow"/>
  <rect x="1215" y="470" width="125" height="60" rx="8" class="out"/>
  <text x="1240" y="508" class="small">P4_out</text>

  <!-- Bottom-up P4_out -> P5_out -->
  <path d="M1215 500 H1120 V300 H1240" class="arrow"/>
  <rect x="1240" y="270" width="135" height="60" rx="8" class="rfa2"/>
  <text x="1258" y="296" class="small">RFAConv</text>
  <text x="1291" y="321" class="tiny">s=2</text>
  <path d="M1375 300 H1405" class="arrow"/>
  <path d="M280 220 H1280 V255 H1405" class="skip"/>
  <text x="1125" y="247" class="tiny">P5 skip</text>
  <rect x="1405" y="270" width="115" height="60" rx="8" class="cat"/>
  <text x="1433" y="308" class="small">Concat</text>
  <path d="M1520 300 H1565" class="arrow"/>
  <rect x="1565" y="270" width="105" height="60" rx="8" class="c3"/>
  <text x="1594" y="308" class="small">C3k2</text>
  <path d="M1670 300 H1678" class="arrow"/>
  <rect x="1405" y="170" width="125" height="60" rx="8" class="rfa"/>
  <text x="1429" y="208" class="small">RFAConv</text>
  <path d="M1618 270 V200 H1530" class="arrow"/>
  <path d="M1405 200 H1340" class="arrow"/>
  <rect x="1215" y="170" width="125" height="60" rx="8" class="out"/>
  <text x="1240" y="208" class="small">P5_out</text>

  <!-- Output note -->
  <text x="1045" y="710" class="small">Detect receives: P3_out, P4_out, P5_out</text>
  <text x="1045" y="738" class="tiny">P4_top is an intermediate fusion feature only.</text>
</svg>
